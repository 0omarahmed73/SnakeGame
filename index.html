<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F6F4" />
    <meta name="description" content="A snake game you can install and play offline. The edges wrap." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snake" />
    <title>Snake</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/quicksand-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <a class="skip" href="#stage">Skip to the board</a>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M14 42h16c8 0 8-12-2-12h-8" fill="none" stroke="#14967a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="24" r="7" fill="#0c6b58"/>
            <circle cx="17.8" cy="22.4" r="1.35" fill="#f4fbf7"/>
            <circle cx="22.4" cy="22.4" r="1.35" fill="#f4fbf7"/>
            <circle cx="46" cy="20" r="5.5" fill="#f59e0b"/>
            <circle cx="44.4" cy="18.4" r="1.5" fill="#fff6e8"/>
          </svg>
          <div>
            <p class="eyebrow">Edges wrap</p>
            <h1>Snake</h1>
          </div>
        </div>
        <div class="scores">
          <div class="score-card">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="score-card">
            <span>Best</span>
            <strong id="best">0</strong>
          </div>
        </div>
      </header>

      <main class="stage" id="stage">
        <div class="bezel">
          <canvas id="board" width="480" height="480">Snake board</canvas>
          <div id="overlay" class="overlay">
            <div class="dialog">
              <h2 id="overlay-title">Ready</h2>
              <p id="overlay-copy">Collect the apples. Leave an edge and you come back on the other side.</p>
              <button id="primary" type="button">Play</button>
            </div>
          </div>
        </div>
        <p id="live" class="sr-only" aria-live="polite"></p>
      </main>

      <section class="controls" aria-label="Game controls">
        <div class="bar">
          <button id="pause" type="button" disabled>Pause</button>
          <button id="sound" type="button" aria-pressed="true">Sound on</button>
          <button id="install" type="button" hidden>Install</button>
        </div>
        <div class="dpad" aria-label="Direction pad">
          <button type="button" data-dir="up" aria-label="Up">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5l7 8H5z"/></svg>
          </button>
          <button type="button" data-dir="left" aria-label="Left">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 12l8-7v14z"/></svg>
          </button>
          <button type="button" data-dir="right" aria-label="Right">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 12l-8 7V5z"/></svg>
          </button>
          <button type="button" data-dir="down" aria-label="Down">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 19l-7-8h14z"/></svg>
          </button>
        </div>
        <p id="hint" class="hint">Arrows or WASD to turn. Space pauses.</p>
      </section>
    </div>
    <script type="module" src="js/game.js"></script>
  </body>
</html>
